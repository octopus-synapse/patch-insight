name: checks
on: [push, pull_request]
jobs:
  contracts-and-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.9.7'
          python-version: '3.11'
      - name: Require resolved lock before claiming reproducibility
        run: test -f uv.lock
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen pytest tests/test_core.py tests/test_contract.py tests/test_v02.py
      - run: uv run --frozen python -m patchinsight.data
      - run: uv build
  ml-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.9.7'
          python-version: '3.11'
      - run: test -f uv.lock
      - run: uv sync --frozen --extra ml --extra dev
      - run: HF_HUB_OFFLINE=1 uv run --frozen pytest tests/test_model.py tests/test_assessment.py tests/test_v02.py -m 'not real_model'
