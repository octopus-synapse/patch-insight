name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency:
  group: release-publication
  cancel-in-progress: false
jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.9.7'
          python-version: '3.11'
      - name: Require publication credential
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: test -n "$HF_TOKEN"
      - run: uv lock --check
      - run: uv sync --frozen --extra ml --extra dev
      - name: Download pinned checkpoint and stage reviewed publication
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uv run --frozen --extra ml python scripts/release.py --tag "$GITHUB_REF_NAME"
          cp -a artifacts/release/model artifacts/model
      - run: PATCHINSIGHT_MODEL=artifacts/model HF_HUB_OFFLINE=1 uv run --frozen --extra ml --extra dev pytest --junitxml=artifacts/release-tests.xml
      - run: uv run --frozen --extra ml python -m patchinsight.data
      - run: uv build
      - run: uv run --frozen python scripts/package_release.py
      - name: Docker offline smoke
        run: bash scripts/docker_smoke.sh
      - name: Publish Hub artifacts
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run --frozen --extra ml python scripts/release.py --publish --tag "$GITHUB_REF_NAME" --output artifacts/hub-publication
      - name: Publish immutable image tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          IMAGE=ghcr.io/octopus-synapse/patch-insight
          docker tag "patchinsight:${GITHUB_REF_NAME#v}" "$IMAGE:$GITHUB_REF_NAME"
          docker tag "patchinsight:${GITHUB_REF_NAME#v}" "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:$GITHUB_REF_NAME"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker inspect --format '{{json .RepoDigests}}' "$IMAGE:$GITHUB_REF_NAME" > artifacts/image-digests.json
      - name: Publish release manifest and packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp artifacts/hub-publication/release-manifest.json dist/
          cp artifacts/image-digests.json dist/
          cp artifacts/release-tests.xml dist/
          cp artifacts/patchinsight-source-*.tar.gz dist/
          sha256sum dist/* > artifacts/SHA256SUMS
          cp artifacts/SHA256SUMS dist/
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --draft
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
      - name: Advance latest after successful publication
        run: |
          docker tag "ghcr.io/octopus-synapse/patch-insight:$GITHUB_REF_NAME" ghcr.io/octopus-synapse/patch-insight:latest
          docker push ghcr.io/octopus-synapse/patch-insight:latest
