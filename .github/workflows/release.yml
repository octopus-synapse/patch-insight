name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to resume
        required: true
        type: string
permissions:
  contents: write
  packages: write
concurrency:
  group: release-publication
  cancel-in-progress: false
jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.9.7'
          python-version: '3.11'
      - name: Require publication credential
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "No HF_TOKEN: only an already published, matching Hub release can be resumed."
          fi
      - name: Free hosted-runner disk for ML image
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - run: uv lock --check
      - run: uv sync --frozen --extra ml --extra dev
      - name: Verify Hub access or previously completed publication
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uv run --frozen --extra ml python - <<'PYCODE'
          import os,json,subprocess
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          if not os.environ.get('HF_TOKEN'):
              config=json.loads(Path('configs/release.json').read_text())
              commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
              for kind in ('model','dataset'):
                  path=hf_hub_download(config[kind+'_repo'],'software-release.json',repo_type=kind,revision=os.environ['RELEASE_TAG'])
                  assert json.loads(Path(path).read_text())['code_commit']==commit, 'Published Hub tag mismatch'
          PYCODE
      - name: Download pinned checkpoint and stage reviewed publication
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uv run --frozen --extra ml python scripts/release.py --tag "$RELEASE_TAG"
          cp -a artifacts/release/model artifacts/model
      - run: PATCHINSIGHT_MODEL=artifacts/model HF_HUB_OFFLINE=1 uv run --frozen --extra ml --extra dev pytest --junitxml=artifacts/release-tests.xml
      - run: uv run --frozen --extra ml python -m patchinsight.data
      - run: uv build
      - run: uv run --frozen python scripts/package_release.py
      - name: Docker offline smoke
        run: bash scripts/docker_smoke.sh
      - name: Publish Hub artifacts
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run --frozen --extra ml python scripts/release.py --publish --tag "$RELEASE_TAG" --output artifacts/hub-publication
      - name: Publish immutable image tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          CODE_SHA="$(git rev-parse HEAD)"
          IMAGE=ghcr.io/octopus-synapse/patch-insight
          docker tag "patchinsight:${RELEASE_TAG#v}" "$IMAGE:$RELEASE_TAG"
          docker tag "patchinsight:${RELEASE_TAG#v}" "$IMAGE:sha-$CODE_SHA"
          docker push "$IMAGE:$RELEASE_TAG"
          docker push "$IMAGE:sha-$CODE_SHA"
          docker inspect --format '{{json .RepoDigests}}' "$IMAGE:$RELEASE_TAG" > artifacts/image-digests.json
      - name: Publish release manifest and packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp artifacts/hub-publication/release-manifest.json dist/
          cp artifacts/image-digests.json dist/
          cp artifacts/release-tests.xml dist/
          cp artifacts/patchinsight-source-*.tar.gz dist/
          (cd dist && sha256sum *) > artifacts/SHA256SUMS
          cp artifacts/SHA256SUMS dist/
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --verify-tag --generate-notes --draft
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' | grep -qx false; then
            mkdir -p artifacts/existing-release
            gh release download "$RELEASE_TAG" --pattern SHA256SUMS --dir artifacts/existing-release
            cmp dist/SHA256SUMS artifacts/existing-release/SHA256SUMS
          fi
          uv run --frozen python - <<'PYCODE'
          import subprocess,json,hashlib,os
          from pathlib import Path
          tag=os.environ['RELEASE_TAG']
          assets=json.loads(subprocess.check_output(['gh','release','view',tag,'--json','assets']))['assets']
          names={a['name'] for a in assets}
          target=Path('artifacts/existing-release');target.mkdir(exist_ok=True)
          for path in sorted(Path('dist').iterdir()):
              if path.name in names:
                  subprocess.run(['gh','release','download',tag,'--pattern',path.name,'--dir',str(target),'--clobber'],check=True)
                  assert hashlib.sha256(path.read_bytes()).digest()==hashlib.sha256((target/path.name).read_bytes()).digest(), 'Existing release asset differs'
              else:
                  subprocess.run(['gh','release','upload',tag,str(path)],check=True)
          PYCODE
          gh release edit "$RELEASE_TAG" --draft=false
      - name: Advance latest after successful publication
        run: |
          docker tag "ghcr.io/octopus-synapse/patch-insight:$RELEASE_TAG" ghcr.io/octopus-synapse/patch-insight:latest
          docker push ghcr.io/octopus-synapse/patch-insight:latest
